<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lumbini</title>

    <style>
        /* Reset and Base Setup */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            min-height: 100vh;
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Helvetica Neue", Arial, sans-serif;
            color: #FFF1C1;
            
            /* Background Configuration */
            background-image: url("https://assets-api.kathmandupost.com/thumb.php?src=https://assets-cdn.kathmandupost.com/uploads/source/news/2019/default/Lumbini_Manoj-Photo_1_1-(2).jpg&w=900&height=601");
            background-position: center;
            background-size: cover;
            background-attachment: fixed;
            background-repeat: no-repeat;
            
            display: flex;
            flex-direction: column;
        }

        /* Top Navigation Bar */
        .navbar {
            display: flex;
            align-items: center;
            padding: 1rem 2rem;
            background: rgba(10, 35, 75, 0.6);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            position: sticky;
            top: 0;
            z-index: 1000;
            height: 40px;
        }

        .nav-button {
            color: #FFF1C1;
            background-color: rgba(255, 241, 193, 0.15);
            border: 1px solid rgba(255, 241, 193, 0.3);
            padding: 0.5rem 1.25rem;
            border-radius: 5px;
            text-decoration: none;
            font-size: 0.95rem;
            font-weight: 500;
            transition: all 0.3s ease;
        }

        .nav-button:hover {
            background-color: rgba(255, 241, 193, 0.3);
            color: #ffffff;
            transform: translateY(-1px);
        }

       
        .content-container {
            margin-top: auto;
            margin-bottom: 50vh;
            margin-left: 0vh;
            margin-right: auto;
            max-width: 350px;
            text-align: left;
            padding: 2.5rem;
            
            
            background: rgba(20, 24, 33, 0.55);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 215, 0, 0.2);
            border-radius: 6px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
        }

        .describe {
            color: #ffd700;
            font-size: clamp(2.5rem, 6vw, 4.5rem);
            font-weight: 700;
            line-height: 1.1;
            letter-spacing: -0.01em;
            margin-bottom: 1.25rem;
            text-shadow: 0 2px 10px rgba(0, 0, 0, 0.4);
        }

        .description-text {
            font-size: clamp(1.1rem, 2vw, 1.35rem);
            line-height: 1.6;
            color: #FFF1C1;
            font-weight: 400;
            text-shadow: 0 1px 4px rgba(0, 0, 0, 0.6);
        }


        @media (max-width: 768px) {
            .content-container {
                margin: auto 1.5rem 2rem 1.5rem;
                padding: 1.75rem;
                max-width: none;
            }

            .navbar {
                padding: 0.75rem 1rem;
            }
        }
    </style>
</head>

<body>
    <header class="navbar">
        <a href="Nepal-ICS3U.html" class="nav-button">Home</a>
    </header>

    <main class="content-container">
        <h1 class="describe">Lumbini</h1>
        <p class="description-text">
            Lumbini is a peaceful and sacred sanctuary in Nepal. Celebrated globally as the birthplace of Lord Gautama Buddha, it stands as one of the most revered spiritual centers and pilgrimage sites for Buddhists around the world.
        </p>
    </main>
</body>
</html>
