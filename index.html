
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login Page</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    font-family: Arial, sans-serif;
    background: linear-gradient(135deg, #10172b, #315fd8);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
}

.login-container {
    background: white;
    width: 100%;
    max-width: 400px;
    padding: 40px 30px;
    border-radius: 18px;
    box-shadow: 0 15px 40px rgba(0,0,0,0.25);
}

h1 {
    text-align: center;
    color: #17213b;
    margin-bottom: 10px;
}

.subtitle {
    text-align: center;
    color: #777;
    margin-bottom: 30px;
}

.input-group {
    margin-bottom: 20px;
}

label {
    display: block;
    margin-bottom: 8px;
    color: #333;
    font-weight: bold;
}

input[type="email"],
input[type="password"],
input[type="text"] {
    width: 100%;
    padding: 13px;
    border: 1px solid #ddd;
    border-radius: 8px;
    outline: none;
    font-size: 15px;
}

input:focus {
    border-color: #315fd8;
    box-shadow: 0 0 0 2px #315fd822;
}

.password-wrapper {
    position: relative;
}

.password-wrapper input {
    padding-right: 65px;
}

.toggle-password {
    position: absolute;
    right: 12px;
    top: 50%;
    transform: translateY(-50%);
    cursor: pointer;
    color: #315fd8;
    font-size: 13px;
}

.options {
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-size: 13px;
    margin-bottom: 25px;
}

.options a,
.signup a {
    color: #315fd8;
    text-decoration: none;
}

.login-btn {
    width: 100%;
    padding: 14px;
    border: none;
    border-radius: 8px;
    background: #315fd8;
    color: white;
    font-size: 16px;
    font-weight: bold;
    cursor: pointer;
    transition: 0.3s;
}

.login-btn:hover {
    background: #2449ac;
}

.signup {
    text-align: center;
    margin-top: 25px;
    color: #777;
    font-size: 14px;
}

#message {
    text-align: center;
    margin-top: 15px;
    font-size: 14px;
}

</style>
</head>

<body>

<div class="login-container">

    <h1>Welcome Back!</h1>
    <p class="subtitle">Login to your account</p>

    <form id="loginForm">

        <div class="input-group">
            <label for="email">Email Address</label>
            <input
                type="email"
                id="email"
                placeholder="Enter your email"
                required
            >
        </div>

        <div class="input-group">
            <label for="password">Password</label>

            <div class="password-wrapper">
                <input
                    type="password"
                    id="password"
                    placeholder="Enter your password"
                    required
                    minlength="6"
                >

                <span
                    class="toggle-password"
                    onclick="togglePassword()"
                    id="toggleText"
                >Show</span>
            </div>
        </div>

        <div class="options">
            <label style="font-weight:normal">
                <input type="checkbox" id="remember">
                Remember me
            </label>

            <a href="#" onclick="forgotPassword(event)">
                Forgot password?
            </a>
        </div>

        <button type="submit" class="login-btn">
            Sign In
        </button>

        <p id="message"></p>

    </form>

    <p class="signup">
        Don't have an account?
        <a href="#" onclick="signUp(event)">Sign Up</a>
    </p>

</div>

<script>
document.getElementById("loginForm")
.addEventListener("submit", function(event) {
    event.preventDefault();

    const email = document.getElementById("email").value;
    const password = document.getElementById("password").value;

    console.log("Email:", email);
    console.log("Password entered:", password.length > 0
        ? "Yes" : "No");

    console.log("Email valid:",
        document.getElementById("email").checkValidity());
});
// Show and hide password
function togglePassword() {
    const password = document.getElementById("password");
    const toggle = document.getElementById("toggleText");

    if (password.type === "password") {
        password.type = "text";
        toggle.textContent = "Hide";
    } else {
        password.type = "password";
        toggle.textContent = "Show";
    }
}

// Login form validation
document.getElementById("loginForm")
.addEventListener("submit", function(event) {

    event.preventDefault();

    const email = document.getElementById("email").value.trim();
    const password = document.getElementById("password").value;
    const message = document.getElementById("message");

    if (!email || !password) {
        message.style.color = "red";
        message.textContent = "Please fill in all fields.";
        return;
    }

    if (password.length < 6) {
        message.style.color = "red";
        message.textContent = "Password must be at least 6 characters.";
        return;
    }

    message.style.color = "#315fd8";
    message.textContent =
        "Form validated! Connect a secure login service to sign in.";

});

// Forgot password
function forgotPassword(event) {
    event.preventDefault();
    alert("Please connect a password recovery service.");
}

// Sign up
function signUp(event) {
    event.preventDefault();
    alert("Please create a registration page.");
}

</script>
